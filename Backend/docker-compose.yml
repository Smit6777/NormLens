version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - API_KEY=test-api-key
      - ADMIN_API_KEY=admin-api-key
      - RATE_LIMIT=100/hour
      - ENABLE_CACHE=true
      - ENABLE_LLM_EXTRACTOR=false
      - ENABLE_HINDI=false
    restart: always
